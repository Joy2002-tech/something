name: Update IPO Watch data

on:
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Fetch permitted IPO feed
        env:
          IPO_FEED_URL: ${{https://www.investorgain.com}}
        run: python scripts/update_ipo_data.py
      - name: Commit updated data
        run: |
          git config user.name "igris-ipo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ipo-data.json
          git diff --cached --quiet || git commit -m "Update IPO Watch data"
          git push
